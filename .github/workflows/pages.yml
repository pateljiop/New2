name: Deploy birthday site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check HTML references and IDs
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('script.js', 'utf8');
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(m => m[1]);
          const duplicates = [...new Set(ids.filter((id, i) => ids.indexOf(id) !== i))];
          const idSet = new Set(ids);
          const missingIds = [...new Set([...js.matchAll(/\$\\("#([^"]+)"\\)/g)].map(m => m[1]).filter(id => !idSet.has(id)))];
          const refs = [...html.matchAll(/\b(?:src|href)="([^"]+)"/g)].map(m => m[1])
            .filter(ref => ref.startsWith('./'));
          const missingFiles = refs.filter(ref => !fs.existsSync(path.resolve(ref)));
          if (duplicates.length || missingIds.length || missingFiles.length) {
            console.error({ duplicates, missingIds, missingFiles });
            process.exit(1);
          }
          console.log(`Static checks passed: ${ids.length} unique IDs; ${refs.length} local references resolved.`);
          NODE

  deploy:
    name: Deploy site
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
